<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14181f">
<title>Chess Coach</title>
<style>
:root{--bg:#14181f;--panel:#1c222c;--line:#2b3442;--ink:#e9edf3;--dim:#93a0b4;--light:#e7dcc6;--dark:#6f8a6b;
--best:#3fb37f;--good:#7fb6e8;--inacc:#e6c14a;--mist:#e8923a;--blun:#e2554f;--acc:#f0b84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:var(--dim)}
#opening{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
#status{white-space:nowrap}
#evalbar{height:6px;background:#3a3f48;margin:0 0 2px}
#evalfill{height:100%;width:50%;background:#f1f1f1;transition:width .4s}
#boardwrap{width:min(100vw,560px,58dvh);align-self:center;position:relative}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;user-select:none;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq img{width:96%;height:96%;pointer-events:none}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(240,200,60,.42)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(70,150,240,.55)}
.sq.red::before{content:"";position:absolute;inset:0;background:rgba(226,85,79,.62)}
.sq.green::before{content:"";position:absolute;inset:0;background:rgba(63,179,127,.62)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(226,60,60,.9),rgba(226,60,60,0) 72%)}
.sq.dot::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,24,31,.38)}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(20,24,31,.38)}
.sq img{position:relative;z-index:1}
.co{position:absolute;font-size:9px;font-weight:700;opacity:.65;z-index:2}
.co.f{right:2px;bottom:0}.co.r{left:2px;top:0}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
#bar{display:flex;gap:6px;padding:6px 8px}
#bar button{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600}
#bar button:active{background:#263041}
#bar button:disabled{opacity:.4}
#coach{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 14px;border-top:1px solid var(--line)}
.msg{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.msg:first-child{font-size:17px}
.msg .mv{font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.3px;padding:2px 8px;border-radius:20px;margin-right:6px;color:#10131a;vertical-align:1px}
.t-best{background:var(--best)}.t-good{background:var(--good)}.t-inacc{background:var(--inacc)}.t-mist{background:var(--mist)}.t-blun{background:var(--blun);color:#fff}
.t-coach{background:var(--acc)}.t-eng{background:#566277;color:#fff}
.dimtxt{color:var(--dim)}
#sheet{position:fixed;inset:0;background:rgba(8,10,14,.82);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
#card{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88dvh;overflow-y:auto}
#card h2{margin:0 0 4px;font-size:21px}
#card p{margin:6px 0;color:var(--dim)}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.opt{flex:1;min-width:64px;background:#232b38;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 6px;font-size:15px;font-weight:600;text-align:center}
.opt.on{border-color:var(--acc);background:#2e3646}
.go{width:100%;background:var(--acc);color:#14181f;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:8px}
.ghost{width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-weight:600;margin-top:8px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.counts div{background:#232b38;border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;color:var(--dim)}
.counts b{display:block;font-size:20px;color:var(--ink)}
.worst{background:#232b38;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.worst button{float:right;background:var(--acc);border:0;border-radius:8px;padding:6px 12px;font-weight:700;margin-left:8px}
label.sm{font-size:13px;color:var(--dim);display:block;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div id="opening">Chess Coach</div><div id="status"></div></div>
  <div id="evalbar"><div id="evalfill"></div></div>
  <div id="boardwrap"><div id="board"></div></div>
  <div id="bar">
    <button id="bNew">New</button>
    <button id="bUndo">Take back</button>
    <button id="bHint">Hint</button>
    <button id="bResign">Resign</button>
  </div>
  <div id="coach"></div>
</div>
<div id="sheet"><div id="card"></div></div>

<script>/*CHESSJS*/</script>
<script>
"use strict";
var PIECES = /*PIECES*/{};
var OPENINGS = /*OPENINGS*/{};
var SF_B64 = "/*SFB64*/";

var LEVELS = [
  {name:"1", skill:0,  depth:1,  rnd:0.25, blurb:"Beginner"},
  {name:"2", skill:1,  depth:2,  rnd:0.10, blurb:"Beginner"},
  {name:"3", skill:3,  depth:3,  rnd:0,    blurb:"Casual"},
  {name:"4", skill:6,  depth:4,  rnd:0,    blurb:"Casual"},
  {name:"5", skill:9,  depth:6,  rnd:0,    blurb:"Club"},
  {name:"6", skill:12, depth:8,  rnd:0,    blurb:"Club"},
  {name:"7", skill:16, depth:10, rnd:0,    blurb:"Strong"},
  {name:"8", skill:20, depth:13, rnd:0,    blurb:"Full strength"}
];
var ANALYSIS = {depth:13, ms:1600};
var VAL = {p:1,n:3,b:3,r:5,q:9,k:0};
var PNAME = {p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};
var LABEL = {best:"Best",good:"Good",inacc:"Inaccuracy",mist:"Mistake",blun:"Blunder"};

var $ = function(id){return document.getElementById(id);};
var S = {game:null, me:"w", level:2, recs:[], gen:0, sel:null, pre:null, busy:false, over:false,
         review:null, lastOpening:"", hint:null, wantPre:null};

/* ---------- engine ---------- */
var Eng = {w:null, q:[], cur:null, ready:false};
function engStart(){
  try{
    var bin = atob(SF_B64), n = bin.length, u = new Uint8Array(n);
    for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u],{type:"application/javascript"}));
    Eng.w = new Worker(url);
    Eng.w.onmessage = function(e){ engLine(typeof e.data==="string"?e.data:String(e.data)); };
    Eng.w.onerror = function(e){ say("coach","The engine failed to start on this browser ("+(e.message||"error")+"). Try opening the file in Chrome."); };
    Eng.w.postMessage("uci");
    Eng.w.postMessage("isready");
  }catch(err){
    say("coach","The engine could not start: "+err.message);
  }
}
function engLine(line){
  if(line==="readyok"){ Eng.ready=true; engNext(); return; }
  var c = Eng.cur; if(!c) return;
  if(line.indexOf("info ")===0 && line.indexOf(" pv ")>0 && line.indexOf(" score ")>0){
    var m = line.match(/ score (cp|mate) (-?\d+)/);
    if(m && line.indexOf("bound")<0){
      c.info = {type:m[1], val:parseInt(m[2],10), pv:line.split(" pv ")[1].trim().split(/\s+/)};
    }
  } else if(line.indexOf("bestmove")===0){
    var best = line.split(/\s+/)[1];
    Eng.cur = null;
    if(c.gen===S.gen) c.done(best, c.info);
    engNext();
  }
}
function engNext(){
  if(!Eng.ready || Eng.cur || !Eng.q.length) return;
  var j = Eng.q.shift();
  if(j.gen!==S.gen){ engNext(); return; }
  Eng.cur = j;
  Eng.w.postMessage("setoption name Skill Level value "+j.skill);
  Eng.w.postMessage("position fen "+j.fen);
  Eng.w.postMessage("go depth "+j.depth+(j.ms?" movetime "+j.ms:""));
}
function engAsk(fen, skill, depth, ms, done){
  Eng.q.push({fen:fen, skill:skill, depth:depth, ms:ms, done:done, gen:S.gen, info:null});
  engNext();
}
function engReset(){
  S.gen++; Eng.q = [];
  if(Eng.cur && Eng.w) Eng.w.postMessage("stop");
}

/* ---------- helpers ---------- */
function winPct(info){           // from the side to move's view, 0..100
  if(!info) return 50;
  if(info.type==="mate") return info.val>0 ? 100 : 0;
  var cp = Math.max(-2000, Math.min(2000, info.val));
  return 50 + 50*(2/(1+Math.exp(-0.00368208*cp)) - 1);
}
function material(fen, color){   // color's material minus the other side's
  var b = fen.split(" ")[0], s = 0;
  for(var i=0;i<b.length;i++){
    var ch = b[i], lo = ch.toLowerCase();
    if(VAL[lo]===undefined) continue;
    var white = ch!==lo;
    s += ((white?"w":"b")===color ? 1 : -1) * VAL[lo];
  }
  return s;
}
function uciToMove(u){ return {from:u.slice(0,2), to:u.slice(2,4), promotion:u.length>4?u[4]:undefined}; }
function sanOf(fen, uci){
  try{ var g = new Chess(fen); var m = g.move(uciToMove(uci)); return m?m.san:null; }catch(e){ return null; }
}
function playLine(fen, pv, maxPlies){   // returns {sans:[], endFen}
  var g = new Chess(fen), out = [];
  for(var i=0;i<pv.length && i<maxPlies;i++){
    var m = g.move(uciToMove(pv[i])); if(!m) break; out.push(m.san);
  }
  return {sans:out, endFen:g.fen()};
}
function lineText(fen, sans){
  var p = fen.split(" "), n = parseInt(p[5],10), white = p[1]==="w", s = "";
  for(var i=0;i<sans.length;i++){
    if(white) s += n+". "+sans[i]+" ";
    else { s += (i===0? n+"... ":"")+sans[i]+" "; n++; }
    white = !white;
  }
  return s.trim();
}
function lostPieces(fenA, fenB, color){   // pieces of `color` on the board in fenA but gone in fenB
  var cnt = function(fen){ var b = fen.split(" ")[0], c = {}; for(var i=0;i<b.length;i++){ var ch=b[i], lo=ch.toLowerCase(); if(VAL[lo]===undefined) continue; if(((ch!==lo)?"w":"b")===color) c[lo]=(c[lo]||0)+1; } return c; };
  var a = cnt(fenA), b = cnt(fenB), out = [];
  ["q","r","b","n","p"].forEach(function(k){ var d=(a[k]||0)-(b[k]||0); if(d>0) out.push({k:k,n:d}); });
  return out;
}
function piecesText(list, mine){
  if(!list.length) return "";
  var words = list.map(function(x, i){
    if(x.n>1) return (x.n===2?"two ":x.n+" ")+PNAME[x.k]+"s";
    return ((mine && i===0 && x.k!=="p") ? "your " : "a ")+PNAME[x.k];
  });
  return words.length>1 ? words.slice(0,-1).join(", ")+" and "+words[words.length-1] : words[0];
}
function tradeText(fenA, fenB, me){        // {mine:"your queen", theirs:"a pawn"}, equal swaps cancelled
  var them = me==="w"?"b":"w";
  var mine = lostPieces(fenA, fenB, me), theirs = lostPieces(fenA, fenB, them);
  mine.forEach(function(x){ theirs.forEach(function(y){ if(x.k===y.k){ var m=Math.min(x.n,y.n); x.n-=m; y.n-=m; } }); });
  mine = mine.filter(function(x){return x.n>0;}); theirs = theirs.filter(function(x){return x.n>0;});
  return {mine:piecesText(mine, true), theirs:piecesText(theirs, false)};
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

/* ---------- coach log ---------- */
function say(kind, html, label){
  var d = document.createElement("div"); d.className = "msg";
  var cls = {best:"t-best",good:"t-good",inacc:"t-inacc",mist:"t-mist",blun:"t-blun",coach:"t-coach",eng:"t-eng"}[kind]||"t-coach";
  var txt = label || LABEL[kind] || (kind==="eng"?"Engine":"Coach");
  d.innerHTML = '<span class="tag '+cls+'">'+txt+'</span>'+html;
  var c = $("coach"); c.insertBefore(d, c.firstChild); c.scrollTop = 0;
}

/* ---------- board ---------- */
function drawBoard(){
  var g = S.review ? new Chess(S.review.fen) : S.game;
  var flip = S.me==="b", el = $("board"), html = "";
  var last = null;
  if(!S.review){ var h = S.game.history({verbose:true}); if(h.length) last = h[h.length-1]; }
  var targets = {};
  if(S.sel && !S.review){
    S.game.moves({square:S.sel, verbose:true}).forEach(function(m){ targets[m.to] = m.captured||m.flags.indexOf("e")>=0 ? "cap":"dot"; });
  }
  var kingSq = null;
  if(g.in_check()){
    var bd = g.board();
    for(var r=0;r<8;r++) for(var f=0;f<8;f++){ var p = bd[r][f]; if(p && p.type==="k" && p.color===g.turn()) kingSq = "abcdefgh"[f]+(8-r); }
  }
  for(var row=0;row<8;row++) for(var col=0;col<8;col++){
    var file = flip ? 7-col : col, rank = flip ? row+1 : 8-row;
    var sq = "abcdefgh"[file]+rank, piece = g.get(sq);
    var cls = "sq "+(((file+rank)%2===0)?"d":"l");
    if(last && (last.from===sq||last.to===sq)) cls += " last";
    if(S.sel===sq) cls += " sel";
    if(targets[sq]) cls += " "+targets[sq];
    if(kingSq===sq) cls += " chk";
    if(S.review){
      if(S.review.red.indexOf(sq)>=0) cls += " red";
      if(S.review.green.indexOf(sq)>=0) cls += " green";
    } else if(S.hint && S.hint.indexOf(sq)>=0) cls += " green";
    html += '<div class="'+cls+'" data-sq="'+sq+'">';
    if(col===0) html += '<span class="co r">'+rank+'</span>';
    if(row===7) html += '<span class="co f">'+"abcdefgh"[file]+'</span>';
    if(piece) html += '<img alt="" src="'+PIECES[piece.color+piece.type.toUpperCase()]+'">';
    html += '</div>';
  }
  el.innerHTML = html;
}
function setEval(info, turn){
  var w = winPct(info); if(turn==="b") w = 100-w;
  $("evalfill").style.width = w.toFixed(1)+"%";
}
function setStatus(t){ $("status").textContent = t; }
function refreshButtons(){
  $("bUndo").disabled = S.over || S.busy || !!S.review || S.recs.filter(function(r){return r.by==="me";}).length===0;
  $("bHint").disabled = S.over || S.busy || !!S.review || S.game.turn()!==S.me;
  $("bResign").disabled = S.over || !!S.review || S.game.history().length===0;
}

/* ---------- openings ---------- */
function checkOpening(){
  var h = S.game.history().map(function(s){return s.replace(/[+#]/g,"");});
  if(h.length>36) return;
  var name = OPENINGS[h.join(" ")];
  if(name && name!==S.lastOpening){
    S.lastOpening = name;
    $("opening").textContent = name;
    say("coach","This is the <b>"+esc(name)+"</b>.","Opening");
  }
}

/* ---------- game flow ---------- */
function newGame(color, level){
  engReset();
  S.game = new Chess(); S.me = color; S.level = level; S.recs = []; S.sel = null; S.pre = null;
  S.busy = false; S.over = false; S.review = null; S.lastOpening = ""; S.hint = null; S.wantPre = null;
  $("coach").innerHTML = ""; $("opening").textContent = "Chess Coach";
  say("coach","You are "+(color==="w"?"White":"Black")+" against level "+LEVELS[level].name+" ("+LEVELS[level].blurb+"). Tap a piece, then tap where it goes. I rate every move you make.");
  drawBoard(); save();
  turnStart();
}
function turnStart(){
  S.hint = null; S.wantHint = false;
  if(S.game.game_over()){ finish(); return; }
  if(S.game.turn()===S.me){
    S.busy = false; setStatus("Your move"); refreshButtons();
    var fen = S.game.fen(), gen = S.gen;
    S.pre = null;
    engAsk(fen, 20, ANALYSIS.depth, ANALYSIS.ms, function(best, info){
      if(gen!==S.gen) return;
      S.pre = {fen:fen, best:best, info:info};
      if(S.game.fen()===fen) setEval(info, S.game.turn());
      if(S.wantPre){ var f = S.wantPre; S.wantPre = null; f(); }
      else if(S.wantHint){ S.wantHint = false; setStatus("Your move"); $("bHint").onclick(); }
    });
  } else {
    engineMove();
  }
}
function engineMove(){
  S.busy = true; setStatus("Engine is thinking…"); refreshButtons();
  var L = LEVELS[S.level], fen = S.game.fen();
  var legal = S.game.moves({verbose:true});
  if(L.rnd && Math.random()<L.rnd && S.game.history().length>4){
    var m = legal[Math.floor(Math.random()*legal.length)];
    setTimeout(function(){ applyEngine(m.from+m.to+(m.promotion||"")); }, 500);
    return;
  }
  engAsk(fen, L.skill, L.depth, 1500, function(best){ applyEngine(best); });
}
function applyEngine(uci){
  var fenBefore = S.game.fen();
  var m = S.game.move(uciToMove(uci));
  if(!m){ var all = S.game.moves({verbose:true}); m = S.game.move(all[0]); }
  S.recs.push({by:"eng", san:m.san, fenBefore:fenBefore});
  say("eng",'<span class="mv">'+esc(m.san)+'</span>'+(m.captured?' <span class="dimtxt">takes your '+PNAME[m.captured]+'.</span>':'')+(S.game.in_check()&&!S.game.in_checkmate()?' <span class="dimtxt">Check.</span>':''));
  checkOpening(); drawBoard(); save();
  turnStart();
}
function tapSquare(sq){
  if(S.review || S.over || S.busy || S.game.turn()!==S.me) return;
  var p = S.game.get(sq);
  if(S.sel){
    var mv = S.game.moves({square:S.sel, verbose:true}).filter(function(m){return m.to===sq;})[0];
    if(mv){ playerMove(mv); return; }
  }
  S.sel = (p && p.color===S.me && S.sel!==sq) ? sq : null;
  drawBoard();
}
function playerMove(mv){
  var fenBefore = S.game.fen(), gen = S.gen;
  var m = S.game.move({from:mv.from, to:mv.to, promotion:"q"});
  if(!m) return;
  S.sel = null; S.hint = null; S.busy = true; setStatus("Checking your move…");
  var rec = {by:"me", san:m.san, uci:m.from+m.to+(m.promotion||""), fenBefore:fenBefore, fenAfter:S.game.fen()};
  S.recs.push(rec);
  drawBoard(); refreshButtons(); checkOpening();
  var afterPre = function(){
    if(gen!==S.gen) return;
    var pre = S.pre;
    if(S.game.game_over()){ judge(rec, pre, null); save(); turnStart(); return; }
    engAsk(rec.fenAfter, 20, ANALYSIS.depth, ANALYSIS.ms, function(best, info){
      if(gen!==S.gen) return;
      judge(rec, pre, {best:best, info:info});
      setEval(info, S.game.turn());
      save();
      turnStart();
    });
  };
  if(S.pre && S.pre.fen===fenBefore) afterPre(); else S.wantPre = afterPre;
}

/* ---------- judging a move ---------- */
function judge(rec, pre, post){
  var me = S.me, mvHtml = '<span class="mv">'+esc(rec.san)+'</span> ';
  if(S.game.in_checkmate()){ rec.kind="best"; rec.drop=0; say("best", mvHtml+"Checkmate."); return; }
  var before = winPct(pre && pre.info);
  var after = post ? 100 - winPct(post.info) : before;
  var drop = Math.max(0, before - after);
  var isBest = pre && pre.best === rec.uci;
  var kind = isBest || drop<2 ? "best" : drop<8 ? "good" : drop<16 ? "inacc" : drop<28 ? "mist" : "blun";
  // a missed forced mate is never better than a mistake
  var hadMate = pre && pre.info && pre.info.type==="mate" && pre.info.val>0;
  var keptMate = post && post.info && post.info.type==="mate" && post.info.val<0;
  if(hadMate && !keptMate && !isBest && (kind==="best"||kind==="good"||kind==="inacc")) kind = "mist";
  rec.kind = kind; rec.drop = drop;
  rec.best = pre ? pre.best : null;
  rec.bestSan = pre && pre.best ? sanOf(rec.fenBefore, pre.best) : null;

  var why = "";
  if(kind==="best"){
    why = isBest ? "The engine's first choice." : "As good as the engine's choice.";
  } else if(kind==="good"){
    why = "A sound move." + (rec.bestSan ? " The engine slightly prefers <b>"+esc(rec.bestSan)+"</b>." : "");
  } else {
    var parts = [];
    // what the opponent can now do
    if(post && post.info){
      var line = playLine(rec.fenAfter, post.info.pv||[post.best], 5);
      if(post.info.type==="mate" && post.info.val>0){
        parts.push("It allows checkmate in "+post.info.val+", starting with <b>"+esc(line.sans[0]||"")+"</b>.");
      } else {
        var swing = material(line.endFen, me) - material(rec.fenBefore, me);
        if(swing<=-1 && line.sans.length){
          var tr = tradeText(rec.fenBefore, line.endFen, me);
          parts.push("It loses "+(tr.mine||"material")+(tr.theirs?" for "+tr.theirs:"")+" after <b>"+esc(lineText(rec.fenAfter, line.sans))+"</b>.");
        }
      }
    }
    // what was there instead
    if(pre && pre.info && rec.bestSan){
      var bl = playLine(rec.fenBefore, pre.info.pv||[pre.best], 5);
      if(hadMate){
        parts.push("You had checkmate in "+pre.info.val+" with <b>"+esc(rec.bestSan)+"</b>.");
      } else {
        var gain = material(bl.endFen, me) - material(rec.fenBefore, me);
        if(gain>=1 && !parts.length){
          var tw = tradeText(rec.fenBefore, bl.endFen, me);
          parts.push("You missed <b>"+esc(lineText(rec.fenBefore, bl.sans))+"</b>, which wins "+(tw.theirs||"material")+(tw.mine?" for "+tw.mine:"")+".");
        }
        else parts.push("Better was <b>"+esc(rec.bestSan)+"</b>.");
      }
    }
    if(parts.length && parts[0].indexOf("Better was")===0) parts.unshift("It weakens your position: no piece is lost at once, but the engine's line leaves you clearly worse.");
    why = parts.join(" ");
  }
  rec.why = why;
  say(kind, mvHtml+why);
}

/* ---------- end of game ---------- */
function finish(resigned){
  S.over = true; S.busy = false;
  var g = S.game, res;
  if(resigned) res = "You resigned.";
  else if(g.in_checkmate()) res = g.turn()===S.me ? "Checkmate. The engine won." : "Checkmate. You won.";
  else if(g.in_stalemate()) res = "Draw by stalemate.";
  else if(g.in_threefold_repetition()) res = "Draw by repetition.";
  else if(g.insufficient_material()) res = "Draw: not enough pieces to mate.";
  else res = "Draw.";
  setStatus("Game over"); refreshButtons(); save();
  say("coach", res+" Tap <b>New</b> for the summary and your worst moves.","Result");
  showSummary(res);
}
function showSummary(res){
  var mine = S.recs.filter(function(r){return r.by==="me" && r.kind;});
  var c = {best:0,good:0,inacc:0,mist:0,blun:0};
  mine.forEach(function(r){ c[r.kind]++; });
  var worst = mine.filter(function(r){return r.kind==="inacc"||r.kind==="mist"||r.kind==="blun";})
                  .sort(function(a,b){return b.drop-a.drop;}).slice(0,3);
  var h = "<h2>"+esc(res||"Game summary")+"</h2><p>"+mine.length+" moves by you"+(S.lastOpening?" · "+esc(S.lastOpening):"")+"</p>";
  h += '<div class="counts">';
  ["best","good","inacc","mist","blun"].forEach(function(k){ h += "<div><b>"+c[k]+"</b>"+LABEL[k]+"</div>"; });
  h += "</div>";
  if(worst.length){
    h += "<p>Your worst moves. Tap Show to see each on the board: red is what you played, green is the better move.</p>";
    worst.forEach(function(r){
      var i = S.recs.indexOf(r);
      h += '<div class="worst"><button data-rev="'+i+'">Show</button><span class="tag t-'+r.kind+'">'+LABEL[r.kind]+'</span><b>'+esc(moveNo(r)+r.san)+"</b><br>"+r.why+"</div>";
    });
  } else h += "<p>No inaccuracies, mistakes or blunders in this game.</p>";
  h += '<button class="go" id="sNew">New game</button><button class="ghost" id="sClose">Look at the board</button>';
  openSheet(h);
  $("sNew").onclick = showNew;
  $("sClose").onclick = closeSheet;
  Array.prototype.forEach.call(document.querySelectorAll("[data-rev]"), function(b){
    b.onclick = function(){ review(parseInt(b.getAttribute("data-rev"),10)); };
  });
}
function moveNo(r){ var p = r.fenBefore.split(" "); return p[5]+(p[1]==="w"?". ":"... "); }
function review(i){
  var r = S.recs[i]; closeSheet();
  var red = [r.uci.slice(0,2), r.uci.slice(2,4)], green = r.best ? [r.best.slice(0,2), r.best.slice(2,4)] : [];
  S.review = {fen:r.fenBefore, red:red, green:green};
  drawBoard(); refreshButtons(); setStatus("Reviewing");
  say(r.kind,'<span class="mv">'+esc(moveNo(r)+r.san)+'</span> '+r.why+' <span class="dimtxt">Tap the board to go back.</span>');
}
function endReview(){ S.review = null; drawBoard(); refreshButtons(); setStatus(S.over?"Game over":"Your move"); if(S.over) showSummary(); }

/* ---------- sheets ---------- */
function openSheet(html){ $("card").innerHTML = html; $("sheet").className = "on"; }
function closeSheet(){ $("sheet").className = ""; }
function showNew(){
  var col = S.me||"w", lv = S.level;
  var h = "<h2>New game</h2><label class='sm'>You play</label><div class='row'>"+
    "<div class='opt' data-c='w'>White</div><div class='opt' data-c='b'>Black</div><div class='opt' data-c='r'>Random</div></div>"+
    "<label class='sm'>Engine level</label><div class='row'>";
  LEVELS.forEach(function(L,i){ h += "<div class='opt' data-l='"+i+"'>"+L.name+"</div>"; });
  h += "</div><p id='lvb'></p><button class='go' id='sGo'>Play</button>";
  if(S.game && !S.over && S.game.history().length) h += "<button class='ghost' id='sBack'>Back to this game</button>";
  openSheet(h);
  var paint = function(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-c]"), function(e){ e.className = "opt"+(e.getAttribute("data-c")===col?" on":""); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-l]"), function(e){ e.className = "opt"+(parseInt(e.getAttribute("data-l"),10)===lv?" on":""); });
    $("lvb").textContent = "Level "+LEVELS[lv].name+": "+LEVELS[lv].blurb+(LEVELS[lv].rnd?". It sometimes plays a random move.":".");
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-c]"), function(e){ e.onclick = function(){ col = e.getAttribute("data-c"); paint(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-l]"), function(e){ e.onclick = function(){ lv = parseInt(e.getAttribute("data-l"),10); paint(); }; });
  paint();
  $("sGo").onclick = function(){ closeSheet(); newGame(col==="r" ? (Math.random()<0.5?"w":"b") : col, lv); };
  if($("sBack")) $("sBack").onclick = closeSheet;
}

/* ---------- buttons ---------- */
$("board").addEventListener("click", function(e){
  if(S.review){ endReview(); return; }
  var t = e.target; while(t && t!==this && !t.getAttribute("data-sq")) t = t.parentNode;
  if(t && t.getAttribute && t.getAttribute("data-sq")) tapSquare(t.getAttribute("data-sq"));
});
$("bNew").onclick = function(){ if(S.over) showSummary(); else showNew(); };
$("bUndo").onclick = function(){
  if(S.busy || S.over) return;
  engReset();
  while(S.recs.length){ var r = S.recs.pop(); S.game.undo(); if(r.by==="me") break; }
  S.sel = null; S.wantPre = null;
  say("coach","Taken back. Try another move.");
  drawBoard(); save(); turnStart();
};
$("bHint").onclick = function(){
  if(!S.pre || S.pre.fen!==S.game.fen()){ S.wantHint = true; setStatus("Finding a hint…"); return; }
  var b = S.pre.best; S.hint = [b.slice(0,2), b.slice(2,4)]; S.sel = null; drawBoard();
  say("coach","The engine would play <b>"+esc(sanOf(S.pre.fen,b)||b)+"</b> (green squares).","Hint");
};
$("bResign").onclick = function(){ if(!S.over && confirm("Resign this game?")){ engReset(); finish(true); } };

/* ---------- saving ---------- */
function save(){
  try{ localStorage.setItem("chesscoach1", JSON.stringify({me:S.me, level:S.level, recs:S.recs, over:S.over, op:S.lastOpening})); }catch(e){}
}
function load(){
  try{
    var d = JSON.parse(localStorage.getItem("chesscoach1")||"null");
    if(!d || !d.recs || !d.recs.length || d.over) return false;
    S.game = new Chess(); S.me = d.me; S.level = d.level; S.recs = [];
    for(var i=0;i<d.recs.length;i++){ if(!S.game.move(d.recs[i].san)) break; S.recs.push(d.recs[i]); }
    S.lastOpening = d.op||""; if(S.lastOpening) $("opening").textContent = S.lastOpening;
    say("coach","Picking up your game where you left it.");
    drawBoard(); turnStart(); return true;
  }catch(e){ return false; }
}

/* ---------- start ---------- */
S.game = new Chess(); drawBoard(); refreshButtons();
engStart();
if(!load()) showNew();
</script>
</body>
